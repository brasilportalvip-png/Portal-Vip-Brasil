name: Automatic Video Retries

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: video-retries
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-video-retries:
    name: Trigger Video Retries Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Video Retries Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET não configurado no repositório GitHub. Cadastre em Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Disparando worker de retentativas de vídeo no domínio oficial de produção..."

          RESPONSE=$(curl -sS --fail-with-body \
            --max-time 270 \
            -X POST "https://portal-vip-brasil.vercel.app/api/cron/video-retries" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: GitHubActions-VideoRetryWorker/1.0" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github_actions"}')

          echo "Resposta sanitizada do worker:"
          echo "$RESPONSE"
