name: Automatic Social Publications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: social-publications
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-due-content:
    name: Publish Due Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Social Publication Worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET não configurado em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          CODE=$(curl -sS --fail-with-body -o resposta.json -w '%{http_code}' --max-time 270 \
            -X POST "https://portal-vip-brasil.vercel.app/api/cron/social-publications" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: GitHubActions-SocialPublicationWorker/1.0" \
            -H "Content-Type: application/json" \
            || true)
          echo "HTTP $CODE"
          head -c 3000 resposta.json 2>/dev/null || true
          echo
          # 409 = a execução anterior ainda está trabalhando; não é erro.
          if [ "$CODE" = "200" ] || [ "$CODE" = "409" ]; then exit 0; fi
          echo "::error::Worker respondeu HTTP $CODE"
          exit 1
