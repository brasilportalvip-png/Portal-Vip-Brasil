name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Test & Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify serverless production entry
        run: node --import tsx test/serverlessEntryCheck.mjs

      - name: Run Quality Gate Check
        run: npm run check

  smoke-production:
    name: Production Smoke After Merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify deployed production commit and public runtime
        env:
          EXPECTED_RELEASE: portal-final-r5c-20260904
          PRODUCTION_URL: https://portal-vip-brasil.vercel.app
        run: node test/productionSmoke.mjs
