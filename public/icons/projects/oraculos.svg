<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="mysticCosmic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B0764" />
    </radialGradient>
    <linearGradient id="goldArcana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0F051D" stroke="#8B5CF6" stroke-width="3" stroke-opacity="0.5" />
  <!-- Celestial Astrological Zodiac Circle -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.7" />
  <circle cx="100" cy="100" r="50" fill="#1E0A3A" stroke="#C084FC" stroke-width="1.5" />
  <!-- All-Seeing Eye of Wisdom / Providence -->
  <path d="M60 98 C72 78 128 78 140 98 C128 118 72 118 60 98 Z" fill="#2E1065" stroke="url(#goldArcana)" stroke-width="2.5" />
  <circle cx="100" cy="98" r="14" fill="url(#mysticCosmic)" />
  <circle cx="100" cy="98" r="6" fill="#0F051D" />
  <circle cx="103" cy="95" r="2.5" fill="#FFFFFF" />
  <!-- Celestial 8-Point Star over eye -->
  <path d="M100 48 L103 62 L116 66 L104 72 L106 86 L96 76 L84 82 L90 70 L80 62 L94 62 Z" fill="url(#goldArcana)" />
  <!-- Ancient Nordic Runes / Arcana Symbols -->
  <text x="68" y="65" font-family="serif" font-size="12" font-weight="bold" fill="#DDD6FE">ᚠ</text>
  <text x="132" y="65" font-family="serif" font-size="12" font-weight="bold" fill="#DDD6FE">ᚱ</text>
  <text x="60" y="138" font-family="serif" font-size="12" font-weight="bold" fill="#DDD6FE">ᛏ</text>
  <text x="138" y="138" font-family="serif" font-size="12" font-weight="bold" fill="#DDD6FE">ᛋ</text>
  <text x="100" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#E9D5FF" text-anchor="middle" letter-spacing="3">ORÁCULOS</text>
  <text x="100" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="1.5">TAROT &amp; RUNAS</text>
</svg>
