  </defs>
  <rect width="200" height="200" rx="40" fill="#0C0505" stroke="#DC2626" stroke-width="3" stroke-opacity="0.5" />
  <!-- Crossroads circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#991B1B" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="100" cy="100" r="50" fill="#1C0A0A" stroke="#DC2626" stroke-width="1.5" />
  <!-- Sacred Crossroads X -->
  <line x1="45" y1="45" x2="155" y2="155" stroke="#7F1D1D" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="155" y1="45" x2="45" y2="155" stroke="#7F1D1D" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
  <!-- Exu Trident of Guardians -->
  <!-- Center blade -->
  <path d="M100 48 L106 75 L103 145 L97 145 L94 75 Z" fill="url(#ironTrident)" />
  <polygon points="100,42 93,58 107,58" fill="#FEE2E2" />
