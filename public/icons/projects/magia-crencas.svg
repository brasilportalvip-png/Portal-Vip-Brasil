  <circle cx="100" cy="100" r="72" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" stroke-opacity="0.6" />
  <circle cx="100" cy="100" r="54" fill="#261A05" stroke="#FCD34D" stroke-width="2" />
