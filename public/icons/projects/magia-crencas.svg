  <path d="M100 62 C85 82 82 108 100 130 C118 108 115 82 100 62 Z" fill="url(#goldGlow)" filter="url(#glow)" />
  <path d="M100 78 C92 92 90 110 100 126 C110 110 108 92 100 78 Z" fill="#FFFBEB" opacity="0.9" />
  <path d="M78 95 C82 112 92 124 100 130 C90 122 82 110 78 95 Z" fill="#F59E0B" opacity="0.8" />
  <path d="M122 95 C118 112 108 124 100 130 C110 122 118 110 122 95 Z" fill="#F59E0B" opacity="0.8" />
